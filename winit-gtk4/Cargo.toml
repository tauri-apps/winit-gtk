[package]
description = "Winit's GTK4 backend"
documentation = "https://docs.rs/tauri-winit-gtk4"
edition.workspace = true
license.workspace = true
name = "tauri-winit-gtk4"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Published as `tauri-winit-gtk4` but used as `winit_gtk4`.
[lib]
name = "winit_gtk4"

[dependencies]
dpi.workspace = true
gdk4-wayland.workspace = true
gdk4-x11.workspace = true
gtk4.workspace = true
rwh_06.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
winit-common = { workspace = true, features = ["xkb"] }
winit-core.workspace = true
winit-x11.workspace = true
x11rb.workspace = true

[package.metadata.docs.rs]
all-features = true
